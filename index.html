<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mesélőtárgyak">
  <title>Mesélőtárgyak</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: #30291f; background: #f6f2e9; }
    header { padding: 2rem 1rem 1rem; text-align: center; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 500; }
    main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    figure { margin: 0 auto; }
    img { display: block; width: 100%; height: auto; border-radius: 4px; }
    figcaption { padding: .8rem 0 2rem; text-align: center; color: #65594b; font-size: 1rem; }
  </style>
</head>
<body>
  <header><h1>Mesélőtárgyak</h1></header>
  <main>
    <figure>
      <img src="galeria19.jpg" alt="Régi bútorokkal berendezett, napfényes szoba">
      <figcaption>Tárgyak, amelyeknek történetük van.</figcaption>
    </figure>
  </main>
</body>
</html>
